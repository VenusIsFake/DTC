<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial gradient for subtle depth -->
    <radialGradient id="dtcNavyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2E47" />
      <stop offset="85%" stop-color="#16233A" />
      <stop offset="100%" stop-color="#0B132B" />
    </radialGradient>
    <!-- Linear gold gradient for outer ring -->
    <linearGradient id="dtcGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6D1F" />
    </linearGradient>
    <path id="textCircleTop" d="M 70,250 A 180,180 0 0,1 430,250" fill="none" />
    <path id="textCircleBottom" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
  </defs>

  <!-- Outer Dark Navy Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#dtcNavyGrad)" />

  <!-- Outer Gold Concentric Border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#dtcGoldGrad)" stroke-width="4" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#DCD7CB" stroke-width="1" stroke-opacity="0.4" />

  <!-- Inner Concentric Border Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="url(#dtcGoldGrad)" stroke-width="3" />
  <circle cx="250" cy="250" r="142" fill="none" stroke="#DCD7CB" stroke-width="1" stroke-opacity="0.3" />

  <!-- Circular Arc Typography (Top) -->
  <text font-family="'Source Serif 4', 'Georgia', serif" font-size="24" font-weight="700" fill="#F7F5F0" letter-spacing="4">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      DENTALK CLUB FMDC
    </textPath>
  </text>

  <!-- Circular Arc Typography (Bottom) -->
  <text font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#D4AF37" letter-spacing="6">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      • CASABLANCA 2024 •
    </textPath>
  </text>

  <!-- Center Shield / Emblem Graphics -->
  <g transform="translate(250, 250)">
    <!-- Central Stylized Tooth & Microphone Caduceus Icon -->
    <!-- Stylized Tooth Outline -->
    <path d="M -45,-55 C -65,-30 -60,10 -35,50 C -20,75 -10,80 -5,80 C 0,80 5,50 15,30 C 25,50 30,80 35,80 C 40,80 50,75 65,50 C 90,10 95,-30 75,-55 C 60,-75 25,-70 15,-55 C 5,-40 -5,-40 -15,-55 C -25,-70 -60,-75 -45,-55 Z"
          fill="#F7F5F0" fill-opacity="0.95" stroke="url(#dtcGoldGrad)" stroke-width="3" stroke-linejoin="round" />

    <!-- Microphone & Echo Waves Icon inside tooth -->
    <!-- Vintage Mic Body -->
    <rect x="-10" y="-35" width="20" height="32" rx="10" fill="#16233A" stroke="#D4AF37" stroke-width="2.5" />
    <line x1="-10" y1="-23" x2="10" y2="-23" stroke="#D4AF37" stroke-width="1.5" />
    <line x1="-10" y1="-15" x2="10" y2="-15" stroke="#D4AF37" stroke-width="1.5" />
    <!-- Mic Stand -->
    <path d="M -16,-18 C -16,-3 16,-3 16,-18" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="-3" x2="0" y2="15" stroke="#D4AF37" stroke-width="2.5" />
    <line x1="-12" y1="15" x2="12" y2="15" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />

    <!-- Acoustic Sound Waves (Endless Echoes) -->
    <path d="M -24,-30 A 18,18 0 0,0 -24,-8" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
    <path d="M 24,-30 A 18,18 0 0,1 24,-8" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
    <path d="M -32,-36 A 28,28 0 0,0 -32,-2" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 32,-36 A 28,28 0 0,1 32,-2" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>
